<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Dashboard — Olamilekanwaliu CMS</title>
<link rel="manifest" href="/admin/manifest.webmanifest" />
<meta name="theme-color" content="#1A1208" />
<link rel="apple-touch-icon" href="/admin/icons/apple-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OCMS" />
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#1A1208;--ink-mid:#3D2C14;--muted:#7A6A55;--cream:#FDFAF5;--parchment:#F5EFE0;--gold:#C8862A;--gold-light:#E5A84A;--green:#1A7A4A;--border:rgba(26,18,8,.12)}
  body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--parchment);color:var(--ink);display:flex;min-height:100vh}
  a{color:inherit}
  /* sidebar */
  .side{width:250px;background:var(--ink);color:var(--cream);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .brand{font-family:Georgia,serif;font-size:20px;font-weight:700;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
  .brand span{color:var(--gold-light);font-style:italic}
  .nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
  .nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:none;color:rgba(253,250,245,.75);font-family:inherit;font-size:14px;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.active{background:var(--gold);color:#fff;font-weight:600}
  .nav .count{font-size:12px;background:rgba(255,255,255,.15);border-radius:20px;padding:1px 9px;min-width:24px;text-align:center}
  .nav button.active .count{background:rgba(0,0,0,.2)}
  .side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-top:10px}
  .side-foot a,.side-foot button{display:block;width:100%;text-align:left;background:none;border:none;color:rgba(253,250,245,.6);font-family:inherit;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none}
  .side-foot a:hover,.side-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
  /* main */
  .main{flex:1;padding:28px 32px;overflow-x:hidden}
  .head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .head h1{font-family:Georgia,serif;font-size:26px}
  .head p{color:var(--muted);font-size:13.5px;margin-top:2px}
  .btn{border:none;border-radius:9px;font-family:inherit;font-weight:600;font-size:14px;padding:11px 18px;cursor:pointer;transition:transform .15s,background .2s}
  .btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--gold-light);transform:translateY(-1px)}
  .btn-ink{background:var(--ink);color:var(--cream)}.btn-ink:hover{background:var(--ink-mid)}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--ink)}.btn-ghost:hover{border-color:var(--gold)}
  .btn-sm{font-size:12.5px;padding:7px 12px}
  .btn-danger{background:#fff;border:1px solid rgba(200,60,40,.4);color:#b43c28}.btn-danger:hover{background:#b43c28;color:#fff}
  /* list */
  .rows{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:14px}
  .row.hidden-row{opacity:.5}
  .thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;background:var(--parchment);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;color:var(--gold);font-size:20px}
  .row-main{flex:1;min-width:0}
  .row-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);background:var(--gold-pale,rgba(200,134,42,.12));padding:2px 8px;border-radius:20px;margin-top:3px}
  .ord{display:flex;flex-direction:column;gap:2px}
  .ord button{background:var(--parchment);border:1px solid var(--border);border-radius:6px;cursor:pointer;width:26px;height:22px;font-size:11px;line-height:1}
  .row-actions{display:flex;gap:7px;flex-shrink:0}
  .empty{color:var(--muted);text-align:center;padding:50px;font-size:14px}
  /* editor drawer */
  .overlay{position:fixed;inset:0;background:rgba(26,18,8,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:92vw;background:var(--cream);box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s;z-index:51;overflow-y:auto;padding:26px}
  .drawer.open{transform:none}
  .drawer h2{font-family:Georgia,serif;font-size:22px;margin-bottom:18px}
  .fg{margin-bottom:15px}
  .fg label{display:block;font-size:13px;font-weight:600;color:var(--ink-mid);margin-bottom:6px}
  .fg input[type=text],.fg input[type=number],.fg textarea,.fg select{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .fg textarea{min-height:90px;resize:vertical}
  .fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--gold)}
  .toggle{display:flex;align-items:center;gap:10px}
  .toggle input{width:18px;height:18px}
  .imgprev{margin-top:8px;max-height:120px;border-radius:8px;display:none}
  .uprow{display:flex;gap:8px;align-items:center;margin-top:6px}
  .drawer-foot{display:flex;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--cream);padding:13px 22px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#b43c28}
  .loading{text-align:center;color:var(--muted);padding:40px}
  @media(max-width:720px){.side{width:64px;padding:16px 8px}.brand,.nav .label,.nav .count,.side-foot a span,.side-foot button span{display:none}.main{padding:18px}}
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><span>O</span>CMS</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <a href="/" target="_blank"><span>↗ View website</span></a>
      <button id="logout"><span>⎋ Log out</span></button>
    </div>
  </aside>
  <main class="main">
    <div class="head">
      <div><h1 id="colTitle">Loading…</h1><p id="colDesc"></p></div>
      <button class="btn btn-gold" id="addBtn">+ Add new</button>
    </div>
    <div id="list" class="rows"><div class="loading">Loading…</div></div>
  </main>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <h2 id="drawerTitle">Edit</h2>
    <div id="form"></div>
    <div class="drawer-foot">
      <button class="btn btn-gold" id="saveBtn" style="flex:1">Save</button>
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
    </div>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="../cms-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/admin/sw.js',{scope:'/admin/'}).catch(function(){});});}</script>
</body>
</html>
